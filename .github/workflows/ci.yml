name: Go
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Follow the latest stable Go release; go.mod remains the language floor.
          go-version: stable
          check-latest: true
          cache: false
      - run: go test -timeout 5m -race ./...
      - run: go vet ./...
      - run: go build ./cmd/legidor
      - run: go build ./cmd/legidor-eval
